# Android APK(Capacitor)のビルドと配布。手順と署名は apk/README.md
name: apk

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write # タグのときGitHub Releaseを作るため

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apk/package-lock.json
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21 # Capacitor 8 が Java 21 を要求する
      - name: Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0-dev"; fi
          echo "VERSION_NAME=$v" >> "$GITHUB_ENV"
      - name: Release key
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks"
              echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD_SECRET"
              echo "KEY_ALIAS=$KEY_ALIAS_SECRET"
              echo "KEY_PASSWORD=$KEY_PASSWORD_SECRET"
            } >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 未設定のためデバッグ署名でビルドする。実行ごとに署名が変わり、上書き更新できない(apk/README.md)"
          fi
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD_SECRET: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS_SECRET: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD_SECRET: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Build
        working-directory: apk
        run: |
          npm ci
          npm run build:release
          cp android/app/build/outputs/apk/release/app-release.apk sf6memo.apk
      - name: APKにapp/が同梱されていることを確認
        working-directory: apk
        run: |
          unzip -p sf6memo.apk assets/public/index.html | cmp - ../app/index.html
          unzip -p sf6memo.apk assets/public/app.js | cmp - ../app/app.js
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sf6memo-apk
          path: apk/sf6memo.apk
      - name: GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" apk/sf6memo.apk --title "$GITHUB_REF_NAME" --generate-notes \
            || gh release upload "$GITHUB_REF_NAME" apk/sf6memo.apk --clobber
