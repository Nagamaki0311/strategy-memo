<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- design-spec-v2.1 5章「看板と●」。傾けた1本のネオン管の枠（左下に電極の切れ目）＋重なる2つの●（●P 中＝黄、●K 弱＝水色。アプリのボタンと同じ形・色・重なり）。にじみのfilterはPNG書き出し用の例外（アプリの画面ではfilterを使わない） -->
  <defs>
