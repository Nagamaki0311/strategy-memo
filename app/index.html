<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0E0F11">
<title>SF6戦略メモ</title>
<link rel="stylesheet" href="styles.css">
<script type="module" src="app.js"></script>
</head>
<body>
<!-- 記号のSVGスプライト（design-spec 3章）。画面の記号はUnicodeではなく<use>で描く。tests/check.htmlもここから取り込む -->
<svg id="sprite" width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <!-- ●: 色は呼び出し側のcolor（強度色）。P/Kの線はink -->
  <symbol id="i-dot-p" viewBox="0 0 36 36">
    <circle cx="18" cy="18" r="18" fill="currentColor"/>
    <path d="M13 27V9h6a5 5 0 0 1 0 10h-6" fill="none" stroke="var(--ink)" stroke-width="4" stroke-linecap="square" stroke-linejoin="miter"/>
  </symbol>
  <symbol id="i-dot-k" viewBox="0 0 36 36">
    <circle cx="18" cy="18" r="18" fill="currentColor"/>
    <path d="M12 9v18 M24 9L13 19 M16.5 16L24.5 27" fill="none" stroke="var(--ink)" stroke-width="4" stroke-linecap="square" stroke-linejoin="miter"/>
  </symbol>
  <!-- 矢印: 右向き1つ。8方向は呼び出し側でrotate -->
  <symbol id="i-arrow" viewBox="0 0 24 24">
    <path d="M3 12H15" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="butt"/>
    <polygon points="13,5 22,12 13,19" fill="currentColor"/>
  </symbol>
  <!-- ▶: 軸なし、小さく、color=--conn -->
  <symbol id="i-conn" viewBox="0 0 10 12">
    <polygon points="0,0 10,6 0,12" fill="currentColor"/>
  </symbol>
  <!-- »: DR系（CDR・生ラッシュ）のチップの先頭。左の開いた二重の山形。線画（塗りの▶・軸のある矢印と区別する） -->
  <symbol id="i-rush" viewBox="0 0 12 12">
    <path d="M1.5 2L5.5 6L1.5 10M6.5 2L10.5 6L6.5 10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter"/>
  </symbol>
  <!-- 360: 270度の開いた円弧（上から時計回り）と矢じり。塗りなし -->
  <symbol id="i-360" viewBox="0 0 24 24">
    <path d="M12 5A7 7 0 1 1 5 12" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="butt"/>
    <polygon points="0.5,12 9.5,12 5,4" fill="currentColor"/>
  </symbol>
  <!-- 溜め括弧（矢印の箱と同じ高さ） -->
  <symbol id="i-br-l" viewBox="0 0 6 24">
    <path d="M5 3H2V21H5" fill="none" stroke="currentColor" style="stroke-width:var(--br-sw)" stroke-linecap="butt" stroke-linejoin="miter"/>
  </symbol>
  <symbol id="i-br-r" viewBox="0 0 6 24">
    <path d="M1 3H4V21H1" fill="none" stroke="currentColor" style="stroke-width:var(--br-sw)" stroke-linecap="butt" stroke-linejoin="miter"/>
  </symbol>
  <!-- UI部品の線画（design-spec 5章）。右向きのシェブロンは回転して‹／▾にする -->
  <symbol id="i-chev" viewBox="0 0 24 24">
    <path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square" stroke-linejoin="miter"/>
  </symbol>
  <symbol id="i-plus" viewBox="0 0 24 24">
    <path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="butt"/>
  </symbol>
  <symbol id="i-more" viewBox="0 0 24 24">
    <circle cx="5" cy="12" r="2" fill="currentColor"/><circle cx="12" cy="12" r="2" fill="currentColor"/><circle cx="19" cy="12" r="2" fill="currentColor"/>
  </symbol>
  <!-- 消す（後退）: 左向きのタグ形に×。線画 -->
  <symbol id="i-back" viewBox="0 0 24 24">
    <path d="M9 5h11v14H9L3 12z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="miter"/>
    <path d="M12.5 9.5l5 5M17.5 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="butt"/>
  </symbol>
  <symbol id="i-warn" viewBox="0 0 24 24">
    <path d="M12 3L22 20H2Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="miter"/>
    <path d="M12 9.5v5" fill="none" stroke="currentColor" stroke-width="2.2"/><rect x="11" y="16.5" width="2" height="2" fill="currentColor"/>
  </symbol>
</svg>
<div id="app"></div>
<div id="layer">
  <div id="toast" role="status"></div>
  <div id="live" class="sr-only" aria-live="polite"></div>
</div>
</body>
</html>
