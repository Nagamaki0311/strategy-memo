<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>描画チェック</title>
<link rel="stylesheet" href="../app/styles.css">
<style>
  main { padding: 16px; }
  h2 { margin: 16px 0 8px; font: 400 var(--t-sm) var(--font); color: var(--fg-muted); }
  .case { padding: 8px 0; border-bottom: 1px solid var(--line); }
  .nbox { margin: 0 -16px; }
  .wmrow { display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 16px; background: var(--bg); border-bottom: 1px solid var(--line); }
  .wmrow small { font: 400 var(--t-xs) var(--font); color: var(--fg-muted); }
  #result { margin: 0; padding: 8px 16px; font: 400 var(--t-xs) var(--font); white-space: pre-wrap; }
</style>
</head>
<body>
<!-- ブラウザ検証用（配信しない）。リポジトリルートを配信して /tests/check.html を開く。?gray=1 でグレースケール。結果は #result の CHECK-PASS / CHECK-FAIL -->
<pre id="result">CHECK-PENDING</pre>
<main id="main"></main>
<script type="module">
import { renderRow, charTile } from '../app/app.js';
import { CHARACTERS } from '../app/core.js';

if (new URLSearchParams(location.search).has('gray')) document.documentElement.style.filter = 'grayscale(1)';

const N = (stance, str, key, dir) => ({ type: 'normal', stance, key, str, ...(dir && { dir }) });
const S = (motion, str, key, stance) => ({ type: 'special', motion, key, str, ...(stance && { stance }) });
const sys = (id) => ({ type: 'system', id });
const sa = (level) => ({ type: 'sa', level });
const note = (id) => ({ type: 'note', id });
const mv = (id) => ({ type: 'move', id });

const ALL = [
  N('stand', 'L', 'P'), N('stand', 'M', 'K'), N('stand', 'H', 'P'),
  N('crouch', 'L', 'K'), N('crouch', 'M', 'P'), N('crouch', 'H', 'K'),
  N('jump', 'L', 'P'), N('jump', 'H', 'K'), N('jump', 'M', 'K', 9),
  N('stand', 'H', 'P', 4), N('stand', 'M', 'K', 6), N('stand', 'L', 'P', 7),
  S('236', 'H', 'P'), S('214', 'L', 'K'), S('623', 'M', 'P'), S('22', 'L', 'P'), S('63214', 'H', 'K'),
  S('[4]6', 'H', 'P'), S('[2]8', 'M', 'K'), S('360', 'L', 'P'), S('623', 'M', 'K', 'jump'),
  S('236', 'OD', 'P'), S('214', 'OD', 'K'), S('360', 'OD', 'P'),
  sys('CDR'), sys('RAW_DR'), sys('DI'), sys('PARRY'), sys('REVERSAL'), sa(1), sa(2), sa(3),
  note('CH'), S('236', 'H', 'P'), note('PC'), N('crouch', 'M', 'K'), note('CH'),
  mv('FWD_STEP'), note('CH'), mv('BACK_STEP'),
  N('stand', 'N', 'P'), N('crouch', 'N', 'K'), N('jump', 'N', 'P', 9), S('236', 'N', 'K'), S('623', 'N', 'P', 'jump'),
];
const KENSAN = [N('crouch', 'M', 'K'), S('236', 'H', 'P'), sys('CDR'), N('crouch', 'M', 'K'), S('236', 'H', 'P')];
// システム技・OD・注記の比較列（design-spec-v2 8章）。L・Sで並べ、グレースケール（?gray=1）でも形で区別できることを見る
const SYSMIX = [sys('CDR'), sys('RAW_DR'), sys('DI'), sys('PARRY'), sys('REVERSAL'), sa(1), S('236', 'OD', 'P'), mv('FWD_STEP'), mv('BACK_STEP'), N('stand', 'N', 'P'), S('236', 'N', 'K'), note('CH'), S('236', 'H', 'P')];
const STRESS = [S('23634123641236412364', 'H', 'P'), N('stand', 'L', 'P'), S('[4]6', 'OD', 'K')]; // 20文字の方向列

const DIRS = [S('123456789', 'H', 'P'), S('2565', 'H', 'P')];

// 必殺技の技名（design-spec-v2.2 2章）。同じ列を技名表記とコマンド表記で並べ、発光する要素の数と形を比べる
const NAME_RYU = [S('236', 'M', 'P'), S('623', 'H', 'P'), S('214', 'OD', 'K'), S('236', 'N', 'P'), S('214', 'L', 'K', 'jump'), S('22', 'M', 'P'), S('360', 'H', 'P')]; // 最後の360は辞書にない（コマンドのまま）
const NAME_MIX = [S('236', 'M', 'P'), sys('CDR'), sys('RAW_DR'), sys('DI'), sys('PARRY'), sys('REVERSAL'), sa(1), mv('FWD_STEP'), note('CH'), S('623', 'H', 'P'), S('214', 'OD', 'K'), N('stand', 'N', 'P'), note('PC'), N('crouch', 'M', 'K')];
const NAME_ARJUN = [S('236', 'L', 'P'), N('stand', 'N', 'P', 6), note('CH'), S('236', 'OD', 'P'), N('stand', 'N', 'P', 6), N('stand', 'N', 'P', 6)]; // 派生の連鎖と、親が当たらない6P
const NAME_LONG_CAMMY = [S('236', 'OD', 'P'), S('236', 'H', 'P')]; // 最長の技名 フーリガンコンビネーション ＋ OD
const NAME_LONG_VEGA = [S('[4]6', 'OD', 'P'), S('[4]6', 'H', 'P')];

const CASES = [
  ['L・矢印', ALL, { size: 'L' }],
  ['S・矢印', ALL, { size: 'S' }],
  ['L・数字', ALL, { size: 'L', notation: 'numpad' }],
  ['S・数字', ALL, { size: 'S', notation: 'numpad' }],
  ['L・矢印・補助文字オン', ALL, { size: 'L', strengthLabels: true }],
  ['S・矢印・補助文字オン', ALL, { size: 'S', strengthLabels: true }],
  ['システム技・OD・移動・強度なし・注記の比較 L（CDR・生ラッシュ・DI・DP・Dリバ・SA1・OD236P・前ステ・バクステ・灰色のP/K・CH＋技）', SYSMIX, { size: 'L' }],
  ['システム技・OD・移動・強度なし・注記の比較 S', SYSMIX, { size: 'S' }],
  ['検算の列 L', KENSAN, { size: 'L' }],
  ['検算の列 S', KENSAN, { size: 'S' }],
  ['全方向（1〜9）と5入り L', DIRS, { size: 'L' }],
  ['全方向（1〜9）と5入り S', DIRS, { size: 'S' }],
  ['異常に長い方向列 L（技の内側で折り返す）', STRESS, { size: 'L' }],
  ['異常に長い方向列 S・数字', STRESS, { size: 'S', notation: 'numpad' }],
  ...['L', 'S'].flatMap((sz) => [
    [`技名 ${sz}（リュウ。中波動拳・強昇龍拳・OD竜巻旋風脚・波動拳・弱空中竜巻旋風脚・中電刃錬気、最後の360は辞書にないのでコマンド）`, NAME_RYU, { size: sz, characterId: 'ryu', specialNotation: 'name' }, `name:ryu:${sz}`],
    [`コマンド ${sz}（同じ列。発光する要素の数の比較用）`, NAME_RYU, { size: sz, characterId: 'ryu' }, `cmd:ryu:${sz}`],
    [`技名と他の種別の比較 ${sz}（枠のない文字だけの技名と、DR・DI・DP・SA・移動・注記・通常技の●）`, NAME_MIX, { size: sz, characterId: 'ryu', specialNotation: 'name' }, `name:mix:${sz}`],
    [`コマンド ${sz}（比較列と同じ。発光する要素の数の比較用）`, NAME_MIX, { size: sz, characterId: 'ryu' }, `cmd:mix:${sz}`],
    [`技名 ${sz}（アルジュンの派生。弱大義の巨腕 ▶ 追撃 ▶ OD大義の巨腕 ▶ 追撃、最後の6Pは追撃の次なので派生にならずコマンド）`, NAME_ARJUN, { size: sz, characterId: 'arjun', specialNotation: 'name' }, `name:arjun:${sz}`],
    [`コマンド ${sz}（アルジュン）`, NAME_ARJUN, { size: sz, characterId: 'arjun' }, `cmd:arjun:${sz}`],
  ]),
  ['最長の技名＋OD L（キャミィ フーリガンコンビネーション）', NAME_LONG_CAMMY, { size: 'L', characterId: 'cammy', specialNotation: 'name' }, 'long:cammy:L'],
  ['最長の技名＋OD L（ベガ サイコクラッシャーアタック）', NAME_LONG_VEGA, { size: 'L', characterId: 'vega_mbison', specialNotation: 'name' }, 'long:vega:L'],
  ['最長の技名＋OD S（キャミィ）', NAME_LONG_CAMMY, { size: 'S', characterId: 'cammy', specialNotation: 'name' }, 'long:cammy:S'],
];

const main = document.getElementById('main');
const dirRows = [];
const rowOf = {};
// 記号スプライトは index.html に1つだけ置く。ここへ複製せず取り込む
const html = await (await fetch('../app/index.html')).text();
document.body.prepend(new DOMParser().parseFromString(html, 'text/html').getElementById('sprite'));

for (const [title, tokens, opts, id] of CASES) {
  const h = document.createElement('h2');
  h.textContent = title;
  const box = document.createElement('div');
  box.className = 'case';
  const row = renderRow(tokens, opts);
  if (tokens === DIRS) dirRows.push(row);
  rowOf[id ?? title] = row;
  box.append(row);
  main.append(h, box);
}
// ネオンの段階（design-spec-v2.1 1.6）。charTile（homeScreenと同じタイル）を2つの .grid に並べる。期待値は neonLevel を使わず、表を直接書く
const NEON_LOW = [[0, 0], [1, 1], [2, 2], [3, 3], [5, 4], [8, 5], [12, 6], [18, 7], [28, 8], [45, 9], [70, 10]]; // 各段階の下限
const NEON_REP = [[0, 0], [1, 1], [3, 3], [6, 4], [10, 5], [20, 7], [40, 8], [80, 10]]; // 代表値
const neonGrid = (title, pairs, withKimberly) => {
  const h = document.createElement('h2');
  h.textContent = title;
  const grid = document.createElement('div');
  grid.className = 'grid';
  const [ryu, kim] = ['ryu', 'kimberly'].map((id) => CHARACTERS.find((c) => c.id === id));
  const tiles = pairs.map(([n, lv]) => { const t = charTile(ryu, n); t.expectLv = lv; t.expectN = n; return t; });
  if (withKimberly) { const t = charTile(kim, 80); t.expectLv = 10; t.expectN = 80; tiles.push(t); }
  grid.append(...tiles);
  const box = document.createElement('div');
  box.className = 'nbox';
  box.append(grid);
  main.append(h, box);
  return tiles;
};
const neonLow = neonGrid('ネオンの段階: 各段階の下限（RYU 0・1・2・3・5・8・12・18・28・45・70件）', NEON_LOW);
const neonRep = neonGrid('ネオンの段階: 代表値（RYU 0・1・3・6・10・20・40・80件、KIMBERLY 80件）', NEON_REP, true);
{
  const h = document.createElement('h2');
  h.textContent = 'ネオンの段階: ワードマーク（一覧の上部バーの英字。--bg の上。段階0〜10）';
  const box = document.createElement('div');
  box.className = 'nbox';
  for (let lv = 0; lv <= 10; lv++) {
    const row = document.createElement('div');
    row.className = 'wmrow';
    const wm = document.createElement('span');
    wm.className = 'wm';
    wm.dataset.lv = String(lv);
    wm.textContent = 'RYU';
    wm.expectLv = lv;
    const small = document.createElement('small');
    small.textContent = `段階${lv}`;
    row.append(wm, small);
    box.append(row);
  }
  main.append(h, box);
}
await document.fonts.load('20px "Tilt Neon"'); // 英字の幅の判定の前に、看板書体を読み込んでおく（未読込だと代替書体の幅で測ってしまう）
const problems = [];
const de = document.documentElement;
if (de.scrollWidth > de.clientWidth) problems.push(`横スクロール scrollWidth=${de.scrollWidth} clientWidth=${de.clientWidth}`);
// 全 <use> の参照先が存在する（symbol idの打ち間違い・削除を検出）
for (const u of document.querySelectorAll('use')) {
  if (document.getElementById(u.getAttribute('href').slice(1))?.localName !== 'symbol') problems.push(`<use>の参照先なし ${u.getAttribute('href')}`);
}
// 全チップに読み上げ名
const chips = document.querySelectorAll('.chip');
if (!chips.length) problems.push('チップが描画されていない');
for (const c of chips) if (c.getAttribute('role') !== 'img' || !c.getAttribute('aria-label')) problems.push('チップにrole=imgまたはaria-labelがない');
// 方向1〜9の描画: 矢印は方向ごとの回転、5は素の文字「N」（矢印・中点にしない）
const ANGLE = { 1: 135, 2: 90, 3: 45, 4: 180, 6: 0, 7: 225, 8: 270, 9: 315 };
// 5: 「N」の文字、700、サイズ（L15px／S12px）、色fg、矢印の箱と同じ幅、中央寄せ
const neutralOk = (n, row) => {
  const cs = getComputedStyle(n);
  const arrowW = parseFloat(getComputedStyle(row).getPropertyValue('--arrow'));
  return n.classList.contains('neutral') && n.textContent === 'N' && !n.querySelector('svg')
    && cs.fontWeight === '700' && cs.fontSize === (row.classList.contains('S') ? '12px' : '15px')
    && cs.color === getComputedStyle(document.body).color && cs.textAlign === 'center'
    && Math.abs(n.getBoundingClientRect().width - arrowW) < 0.5;
};
for (const row of dirRows) {
  DIRS.forEach(({ motion }, i) => {
    const parts = [...row.querySelectorAll('.chip')[i].children].slice(0, motion.length);
    const ok = parts.length === motion.length && [...motion].every((d, j) => d === '5'
      ? neutralOk(parts[j], row)
      : parts[j].classList.contains('arrow') && parts[j].style.transform === `rotate(${ANGLE[d]}deg)`);
    if (!ok) problems.push(`方向${motion}の描画が不正`);
    if (motion.includes('5') && !row.querySelectorAll('.chip')[i].getAttribute('aria-label').includes('ニュートラル')) problems.push('方向5のaria-labelがニュートラルでない');
  });
}
// システム技・注記の構造（v2。色を除いた形の手がかりが実際に描かれている）
for (const row of document.querySelectorAll('.row')) {
  const size = row.classList.contains('S') ? 'S' : 'L';
  for (const c of row.querySelectorAll('.sys-dr')) if (!c.querySelector('svg.rush')) problems.push(`${size}: .sys-dr に .rush（»）がない`);
  for (const c of row.querySelectorAll('.sys-di')) if (getComputedStyle(c, '::before').clipPath === 'none') problems.push(`${size}: .sys-di::before の clip-path が none`);
  for (const c of row.querySelectorAll('.tag')) if (getComputedStyle(c, '::before').transform === 'none') problems.push(`${size}: .tag::before の transform が none`);
}
// 移動（前ステ・バクステ）は破線の枠で塗りなし。強度なしは無彩色の●で、補助文字のバッジを付けない
const rgb = (c) => c.match(/\d+/g).slice(0, 3).map(Number);
const lum = (c) => { const [r, g, b] = rgb(c).map((v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4; }); return 0.2126 * r + 0.7152 * g + 0.0722 * b; };
const ratio = (a, b) => { const [x, y] = [lum(a), lum(b)].sort((p, q) => q - p); return (x + 0.05) / (y + 0.05); };
for (const c of document.querySelectorAll('.sys-mv')) {
  const cs = getComputedStyle(c);
  if (cs.borderTopStyle !== 'dashed' || cs.borderTopWidth !== '2px' || cs.backgroundColor !== 'rgba(0, 0, 0, 0)') problems.push(`.sys-mv が破線の枠・塗りなしでない ${cs.borderTopStyle} ${cs.borderTopWidth} ${cs.backgroundColor}`);
}
if (document.querySelectorAll('.sys-mv').length < 2 * 6) problems.push('.sys-mv が足りない');
const strN = [...document.querySelectorAll('.dot.str-n')];
if (strN.length < 8) problems.push('.dot.str-n が足りない');
for (const d of strN) {
  const col = getComputedStyle(d).color;
  if (col !== 'rgb(133, 133, 133)') problems.push(`.dot.str-n の色が違う ${col}`);
  if (ratio(col, 'rgb(14, 15, 17)') < 4.5 /* --ink #0E0F11 */) problems.push('強度なしの●と中の文字の比が4.5未満');
  if (d.querySelector('.badge') || d.classList.contains('has-str')) problems.push('強度なしの●に補助文字のバッジがある');
}
if (!document.querySelector('.sys-dr') || !document.querySelector('.sys-di') || !document.querySelector('.sys-dp') || !document.querySelector('.sys-sa') || !document.querySelector('.tag')) problems.push('システム技・注記の比較列が描画されていない');
// 発光はL寸法のDR・ODだけ。S寸法には、ぼかしのある影・外側の影・text-shadow がない（DPの二重枠は0ぼかしのinsetで、形そのもの）
const glows = (e) => {
  const cs = getComputedStyle(e);
  const parts = cs.boxShadow === 'none' ? [] : cs.boxShadow.split(/,(?![^(]*\))/).map((x) => x.trim());
  const n = (x) => x.replace(/rgba?\([^)]*\)/, '').replace('inset', '').trim().split(/\s+/).map(parseFloat);
  return parts.some((x) => !x.includes('inset') || n(x)[2] > 0) || cs.textShadow !== 'none';
};
for (const e of document.querySelectorAll('.row.S, .row.S *')) if (glows(e)) problems.push(`S寸法に発光 ${e.className}`);
// 必殺技の技名（design-spec-v2.2 6章の6・7・8）。技名の文字、色、形、発光の数、幅
{
  const fgBody = getComputedStyle(document.body).color;
  const nameRows = Object.entries(rowOf).filter(([id]) => id.startsWith('name:'));
  if (nameRows.length !== 6) problems.push('技名の列が足りない');
  for (const [id, row] of nameRows) {
    const size = row.classList.contains('S') ? 'S' : 'L';
    const names = [...row.querySelectorAll('.sname')];
    if (!names.length) problems.push(`${id}: .sname がない`);
    for (const n of names) {
      const cs = getComputedStyle(n);
      if (cs.fontSize !== (size === 'S' ? '12px' : '15px') || cs.fontWeight !== '700' || cs.color !== fgBody || cs.backgroundColor !== 'rgba(0, 0, 0, 0)' || cs.borderTopWidth !== '0px' || cs.whiteSpace !== 'nowrap') problems.push(`${id}: 技名の文字の体裁が違う ${cs.fontSize} ${cs.fontWeight} ${cs.color}`);
      const chip = n.closest('.chip');
      if (chip.querySelector('.arrow, .cw, .num, .charge, .neutral')) problems.push(`${id}: 技名のチップに矢印・数字が残っている`);
      if (chip.querySelector('.dot, .badge')) problems.push(`${id}: 技名のチップに●が出ている（D-019）`);
      const ccs = getComputedStyle(chip);
      if (ccs.backgroundColor !== 'rgba(0, 0, 0, 0)' || ccs.borderTopWidth !== '0px' || ccs.boxShadow !== 'none') problems.push(`${id}: 技名のチップに枠・塗り・影がある`);
      const lbl = chip.getAttribute('aria-label');
      if (!lbl.startsWith(n.textContent)) problems.push(`${id}: aria-label が技名で始まらない ${lbl}`);
    }
    const c = rowOf[id.replace('name:', 'cmd:')];
    const count = (r) => [r, ...r.querySelectorAll('*')].filter(glows).length;
    // 発光はコマンド表記のOD●●と橙の「OD」に付いていたもの。技名表記は文字だけなので、同じ以下（D-019）
    if (count(row) > count(c)) problems.push(`${id}: 技名表記のほうが発光する要素が多い ${count(row)} > ${count(c)}`);
    // コマンド表記の同じ位置のチップは●を出し続ける。技名のないチップ（辞書にない360・通常技）は技名表記でも●が残る
    row.querySelectorAll('.chip').forEach((chip, i) => {
      const cc = c.querySelectorAll('.chip')[i];
      if (chip.querySelector('.sname') && !cc.querySelector('.dot')) problems.push(`${id}: コマンド表記のチップ${i}に●がない`);
      if (!chip.querySelector('.sname') && !chip.classList.contains('sys') && chip.querySelectorAll('.dot').length !== cc.querySelectorAll('.dot').length) problems.push(`${id}: 技名のないチップ${i}の●がコマンド表記と違う`);
    });
    if (c.querySelectorAll('.chip').length !== row.querySelectorAll('.chip').length) problems.push(`${id}: チップの数が違う`);
  }
  const got = [...rowOf['name:ryu:L'].querySelectorAll('.sname')].map((n) => n.textContent).join(',');
  if (got !== '中波動拳,強昇龍拳,OD竜巻旋風脚,波動拳,弱空中竜巻旋風脚,中電刃錬気') problems.push(`リュウの技名が違う ${got}`);
  if (!rowOf['name:ryu:L'].querySelectorAll('.chip')[6].querySelector('.cw')) problems.push('辞書にない360がコマンドで出ていない');
  const ag = [...rowOf['name:arjun:L'].querySelectorAll('.chip')].map((c) => c.querySelector('.sname')?.textContent ?? '-').join(',');
  if (ag !== '弱大義の巨腕,追撃,OD大義の巨腕,追撃,-') problems.push(`アルジュンの派生の技名が違う ${ag}`);
  // 最長の技名＋ODのLチップが行の幅に収まる（折り返さず、はみ出さない）
  for (const [t, row] of Object.entries(rowOf).filter(([id]) => id.startsWith('long:'))) {
    for (const chip of row.querySelectorAll('.chip')) {
      const r = chip.getBoundingClientRect();
      if (r.width > row.clientWidth + 0.5) problems.push(`${t}: チップが行より広い ${r.width} > ${row.clientWidth}`);
      if (r.height > (row.classList.contains('S') ? 26 : 36)) problems.push(`${t}: チップの内側で折り返している ${r.height}`); // 1技の1行の高さは L34・S24
    }
  }
}
const glowL = [...document.querySelectorAll('.row:not(.S) .sys-dr, .row:not(.S) .dot.od, .row:not(.S) .ltr.od')];
if (!glowL.length || !glowL.every(glows)) problems.push('L寸法のDR・ODに発光がない');
for (const e of document.querySelectorAll('.row:not(.S) .sys-sa, .row:not(.S) .sys-di, .row:not(.S) .sys-dp, .row:not(.S) .sys-mv, .row:not(.S) .dot:not(.od)')) if (glows(e)) problems.push(`L寸法で発光してはいけない要素 ${e.className}`);
// ネオンの段階（蛍光グリーン。design-spec-v2.1 1章、D-016）の判定
{
  const layers = (v) => (v === 'none' ? [] : v.split(/,(?![^(]*\))/).map((x) => x.trim()));
  const nums = (x) => x.replace(/rgba?\([^)]*\)/, '').replace('inset', '').trim().split(/\s+/).map(parseFloat); // [x, y, blur, spread?]
  const alpha = (x) => { const m = x.match(/rgba?\(([^)]*)\)/)[1].split(',').map(Number); return m.length === 4 ? m[3] : 1; };
  const bgBody = getComputedStyle(document.body).backgroundColor;
  const line = getComputedStyle(document.documentElement).getPropertyValue('--line').trim().replace(/^#(..)(..)(..)$/, (_, a, b, c) => `rgb(${parseInt(a, 16)},${parseInt(b, 16)},${parseInt(c, 16)})`);
  const minRatio = { plate: 99, wm: 99, press: 99 };
  const tiles = [...neonLow, ...neonRep];
  for (const t of tiles) {
    const lv = t.dataset.lv, en = t.querySelector('.cell-en');
    if (lv !== String(t.expectLv)) problems.push(`data-lv が期待値と違う ${lv} != ${t.expectLv}`);
    // 件数は見せない（件数の文字・メーターがない）。読み上げ名（aria-label）が件数を伝える
    if (t.querySelector('.cell-n, .cell-lv') || t.innerText.trim() !== t.querySelector('.cell-en').textContent) problems.push(`段階${lv}: 英字以外の見える文字・メーターがある`);
    const label = t.getAttribute('aria-label');
    if (t.expectN ? !label.endsWith(` ${t.expectN}件`) : label.includes('件')) problems.push(`段階${lv}: aria-label の件数が合わない ${label}`);
    const tcs = getComputedStyle(en);
    const ts = layers(tcs.textShadow);
    if (ts.length > 2) problems.push(`段階${lv}: text-shadow が3層以上`);
    for (const x of ts) {
      if (nums(x)[2] > 8) problems.push(`段階${lv}: text-shadow のぼかしが8pxを超える ${x}`);
      if (alpha(x) > 0.8) problems.push(`段階${lv}: text-shadow のアルファが0.8を超える ${x}`);
    }
    if ((lv === '0') !== (ts.length === 0)) problems.push(`段階${lv}: text-shadow の有無が段階と合わない ${tcs.textShadow}`);
    // 板の縁から内側への滲み: inset の1層だけ。ぼかし12px以下・広がり6px以下（D-016の緩和。外側の影は不可）。0件は光なし
    const bcs = getComputedStyle(t, '::before');
    const bl = layers(bcs.boxShadow);
    if (bl.length > 1) problems.push(`段階${lv}: ::before の box-shadow が2層以上`);
    for (const x of bl) if (!x.includes('inset') || nums(x)[2] > 12 || nums(x)[3] > 6 || alpha(x) > 0.7) problems.push(`段階${lv}: 板の滲みが上限超え・insetでない ${x}`);
    if ((lv === '0') !== (bl.length === 0)) problems.push(`段階${lv}: 板の滲みの有無が段階と合わない ${bcs.boxShadow}`);
    if (lv === '0' && bcs.backgroundColor !== 'rgb(23, 25, 28)') problems.push(`段階0の板が --surface でない ${bcs.backgroundColor}`);
    for (const e of [t, en]) if (getComputedStyle(e).filter !== 'none' || getComputedStyle(e).backdropFilter !== 'none') problems.push(`段階${lv}: filter が none でない`);
    if (bcs.filter !== 'none' || bcs.backdropFilter !== 'none') problems.push(`段階${lv}: ::before に filter`);
    // 文字と板の地の比（滲みの下の最悪値は e2e 21b が画素で実測する）。押下中は板が --line
    const r = ratio(tcs.color, bcs.backgroundColor);
    minRatio.plate = Math.min(minRatio.plate, r);
    if (r < 4.5) problems.push(`段階${lv}: 文字と板の比が4.5未満 ${r.toFixed(2)}`);
    const press = ratio(tcs.color, line);
    minRatio.press = Math.min(minRatio.press, press);
    if (press < 4.5) problems.push(`段階${lv}: 押下中の文字と板の比が4.5未満 ${press.toFixed(2)}`);
    if (en.scrollWidth > en.clientWidth) problems.push(`段階${lv}: 英字がタイルに収まらない ${en.textContent}`);
  }
  // 隣り合う段階で板か文字が違う（板の地・滲み・文字色・文字の影のいずれか）。0→1は文字色（muted → 点灯色）と板が変わる
  const sig = (t) => { const cs = getComputedStyle(t.querySelector('.cell-en')), b = getComputedStyle(t, '::before'); return `${cs.color}|${cs.textShadow}|${b.backgroundColor}|${b.boxShadow}`; };
  for (let i = 1; i < neonLow.length; i++) if (sig(neonLow[i]) === sig(neonLow[i - 1])) problems.push(`段階${i - 1}と${i}の見た目が同じ`);
  if (new Set(neonLow.map(sig)).size !== 11) problems.push('11段階の見た目が重複している');
  // 板の明るさが段階で単調に増える（段階を逆にしても通ってしまわないように）
  const plateL = (t) => lum(getComputedStyle(t, '::before').backgroundColor);
  for (let i = 1; i < neonLow.length; i++) if (plateL(neonLow[i]) <= plateL(neonLow[i - 1])) problems.push(`段階${i}の板が段階${i - 1}より明るくない`);
  // ワードマーク: 0件はmuted・影なし。全段階で期待値、影の上限、bg との比
  for (const wm of document.querySelectorAll('.wmrow .wm')) {
    const lv = wm.dataset.lv, cs = getComputedStyle(wm);
    if (lv !== String(wm.expectLv)) problems.push('ワードマークの data-lv が期待値と違う');
    if (lv === '0' && (cs.color !== 'rgb(170, 166, 157)' || cs.textShadow !== 'none')) problems.push(`消灯のワードマークが muted・影なしでない ${cs.color} ${cs.textShadow}`);
    if (lv !== '0' && cs.textShadow === 'none') problems.push(`段階${lv}のワードマークに発光がない`);
    for (const x of layers(cs.textShadow)) if (nums(x)[2] > 8 || alpha(x) > 0.8) problems.push(`ワードマーク段階${lv}の影が上限超え ${x}`);
    if (layers(cs.textShadow).length > 2 || cs.filter !== 'none') problems.push(`ワードマーク段階${lv}: 3層以上または filter`);
    const r = ratio(cs.color, bgBody);
    minRatio.wm = Math.min(minRatio.wm, r);
    if (r < 4.5) problems.push(`ワードマーク段階${lv}と bg の比が4.5未満 ${r.toFixed(2)}`);
  }
  if (document.querySelectorAll('.wmrow .wm').length !== 11) problems.push('ワードマークが11段階そろっていない');
  window.neonMin = `plate>=${minRatio.plate.toFixed(2)} press>=${minRatio.press.toFixed(2)} wm>=${minRatio.wm.toFixed(2)}`;
}
// 禁止事項（design-spec-v2 2.6）: グラデーションと、常時の明滅（無限ループのアニメーション）がない。computed（疑似要素を含む）と styles.css の本文の両方で見る
for (const e of document.querySelectorAll('*')) for (const ps of [null, '::before', '::after']) {
  if (/gradient/.test(getComputedStyle(e, ps).backgroundImage)) problems.push(`gradient ${e.className}${ps ?? ''}`);
}
if (document.getAnimations().some((a) => a.effect?.getComputedTiming().iterations === Infinity)) problems.push('無限ループのアニメーションが動いている');
const cssText = (await (await fetch('../app/styles.css')).text()).split('\n').filter((l) => !l.includes('data:font/')).join('\n');
if (/gradient\(|infinite/.test(cssText)) problems.push('styles.css に gradient または infinite がある');
const rows = document.querySelectorAll('.row').length;
document.getElementById('result').textContent = problems.length
  ? `CHECK-FAIL w=${window.innerWidth} rows=${rows} ${[...new Set(problems)].join(' / ')}`
  : `CHECK-PASS w=${window.innerWidth} scrollWidth=${de.scrollWidth} rows=${rows} neon ${window.neonMin}`;
</script>
</body>
</html>
